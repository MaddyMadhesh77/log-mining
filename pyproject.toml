[project]
name = "logsense-ai"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pyspark==3.5.1",
    "kafka-python>=2.0.2",
    "hdfs>=2.7.3",
    "drain3>=0.9.11",
    "elasticsearch>=8.13.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "xgboost>=2.0.3",
    "scikit-learn>=1.4.2",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.4",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
    "ipykernel>=6.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config", "ingestion", "parsing",
    "mining", "anomaly", "evaluation",
    "batch", "api", "utils",
]